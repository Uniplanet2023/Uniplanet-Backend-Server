apiVersion: skaffold/v4beta8
kind: Config
build:
  artifacts:
    - image: uniplanet/auth
      context: auth
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: uniplanet/products
      context: products
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: uniplanet/mail
      context: mail
      sync:
        manual:
          - src: src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
  local:
    push: false
manifests:
  rawYaml:
    - ./infra/k8s/*
    # - ./infra/k8s-dev/*
deploy:
  kubectl: {}
 