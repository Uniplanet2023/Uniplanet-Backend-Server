name: deploy-manifest
on:
  push:
    branches:
      - main
    paths:
      - "infra/minikube-prod-doks/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{secrets.DIGITALOCEAN_ACCESS_TOKEN}}
      - run: doctl kubernetes cluster kubeconfig save uniplanet-back
      - run: kubectl apply -f infra/minikube && kubectl apply -f infra/minikube-prod-doks
