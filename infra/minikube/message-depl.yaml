apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-depl
spec:
  replicas: 1
  selector: # letting deployment know what app should dealing with
    matchLabels:
      app: message
  template: # specify exact configuration of the pod we want to deployment to create
    metadata:
      labels:
        app: message
    spec:
      containers:
        - name: message
          image: uniplanet/message
          resources:
            limits:
              memory: 500Mi
              cpu: "200m"
            requests:
               memory: 200Mi
               cpu: "150m"
          env:
            - name: COOKIE_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: cookie-secret
                  key: COOKIE_SESSION_KEY
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: KAFKA_BROKER
            - name: JWT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_TOKEN_SECRET
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: REDIS_PORT
            - name: DEVELOPMENT_MODE
              valueFrom:
                secretKeyRef:
                  name: development-mode
                  key: DEVELOPMENT_MODE
---
apiVersion: v1
kind: Service
metadata:
  name: message-srv
spec: 
  selector:
    app: message
  ports:
    - name: message
      protocol: TCP
      port: 3004
      targetPort: 3004
