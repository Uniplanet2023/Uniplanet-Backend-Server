apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-depl
spec:
  replicas: 1
  selector: # letting deployment know what app should dealing with
    matchLabels:
      app: account
  template: # specify exact configuration of the pod we want to deployment to create
    metadata:
      labels:
        app: account
    spec:
      containers:
        - name: account
          image: uniplanet/account
          resources:
            limits:
              memory: 250Mi
              cpu: "200m"
            requests:
               memory: 200Mi
               cpu: "150m"
          env:
            - name: MONGO_DB_HOST
              value: "mongodb://account-mongo-srv:27017/account"
            - name: COOKIE_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: cookie-secret
                  key: COOKIE_SESSION_KEY
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: KAFKA_BROKER
            - name: JWT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_TOKEN_SECRET
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: REDIS_PORT
            - name: DEVELOPMENT_MODE
              valueFrom:
                secretKeyRef:
                  name: development-mode
                  key: DEVELOPMENT_MODE
---
apiVersion: v1
kind: Service
metadata:
  name: account-srv
spec: 
  selector:
    app: account
  ports:
    - name: account
      protocol: TCP
      port: 3002
      targetPort: 3002
