apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-mongo-depl
spec:
  replicas:  1
  selector:
    matchLabels:
      app: account-mongo
  template:
    metadata:
      labels:
        app: account-mongo
    spec:
      containers:
        - name: account-mongo
          image: mongo
          resources:
            limits:
              memory: 200Mi
              cpu: "200m"
            requests:
              memory: 100Mi
              cpu: "150m"
          ports:
          - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: account-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: account-mongo-srv
spec:
  selector:
    app: account-mongo
  ports:
    - name: account-db
      protocol: TCP 
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: account-mongo-storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: account-mongo-storage
provisioner: dobs.csi.digitalocean.com
parameters:
  type: ext4
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: do-snapshot-class
  annotations:
    k10.kasten.io/is-snapshot-class: "true"
driver: dobs.csi.digitalocean.com
deletionPolicy: Delete