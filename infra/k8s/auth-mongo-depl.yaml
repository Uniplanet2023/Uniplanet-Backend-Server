apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-mongo-depl
spec:
  replicas:  2
  selector:
    matchLabels:
      app: auth-mongo
  template:
    metadata:
      labels:
        app: auth-mongo
    spec:
      containers:
        - name: auth-mongo
          image: mongo
          resources:
            limits:
              memory: 250Mi
              cpu: "200m"
            requests:
              memory: 250Mi
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-mongo-srv
spec:
  type: NodePort
  selector:
    app: auth-mongo
  ports:
    - name: db
      protocol: TCP
      nodePort: 30000
      port: 27017
      targetPort: 27017
